name: Build and Analyze

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build, Test, and Analyze
    runs-on: ubuntu-latest

    # Tells the runner to execute all 'run' commands inside your Java folder
    defaults:
      run:
        working-directory: ./backend/SafeWalk

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and Test with Maven
        run: mvn clean verify

      - name: Upload Coverage Report to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: true
          # Make sure Codecov knows where to find the report in the nested folder
          files: ./backend/SafeWalk/target/site/jacoco/jacoco.xml
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar