# Tell Spring to use H2 for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Dialect configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create the schema based on your entities
spring.jpa.hibernate.ddl-auto=create-drop

# Optional: show SQL in the test logs for easier debugging
spring.jpa.show-sql=true

# Dummy API keys and secrets for test context
app.google.maps.api-key=dummy-test-api-key

# Twilio Test Configuration
app.twilio.account-sid=test_account_sid
app.twilio.auth-token=test_auth_token
app.twilio.from-number=+1234567890

app.routing.segment-buffer-meters=300
app.routing.penalty-meters-per-severity-point=50
api.prefix=/api/v1

app.anomaly.arrival-radius-meters=30
app.anomaly.auto-end-grace-period-seconds=600
app.anomaly.idle-threshold-seconds=180
app.anomaly.alarm-grace-period-seconds=45
app.anomaly.deviation-warning-threshold-meters=50
app.anomaly.deviation-emergency-threshold-meters=200
app.anomaly.ws-timeout-seconds=60
